<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Exezyra. AI agents that build, backtest, and run crypto trading strategies.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="1" stop-color="#0c1b2a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#163044" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1080" cy="70" r="90" fill="none" stroke="#1d4e68" stroke-width="1"/>
  <circle cx="90" cy="350" r="70" fill="none" stroke="#1d4e68" stroke-width="1"/>
  <text x="600" y="168" text-anchor="middle" fill="#8fb4c9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="6">TRADING LAYER FOR AI AGENTS</text>
  <text x="600" y="236" text-anchor="middle" fill="#f4f8fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1">BUILD, BACKTEST, AND RUN</text>
  <text x="330" y="312" text-anchor="middle" fill="#d5e7f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3">BINANCE</text>
  <text x="600" y="312" text-anchor="middle" fill="#d5e7f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3">HYPERLIQUID</text>
  <text x="870" y="312" text-anchor="middle" fill="#d5e7f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3">MCP</text>
</svg>
